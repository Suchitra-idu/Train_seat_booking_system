# One-command bring-up (PLAN §6):  cp .env.example .env && docker compose up
# Services start in dependency order behind healthchecks, so the stack is usable the
# moment `up` finishes. migrate/seed/api/web are placeholders in P0 and become real in
# P3/P5/P6/P8 — the wiring, ordering, healthchecks, and profiles are what P0 delivers.

name: slr

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Alembic (btree_gist + EXCLUDE constraint) lands in P3. Runs once, then exits.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-c", "print('migrate: no migrations yet (P3)')"]

  # Config-driven seed of stations/coaches/fares lands in P8. Runs once, then exits.
  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-c", "print('seed: config-driven seed lands in P8')"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "${API_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file: .env
    ports:
      - "${WEB_PORT}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # busybox wget (node:alpine) lacks --spider; use node's http client instead.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # ─── Profiles: not started by default `up` ─────────────────────────────
  # docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    volumes:
      - .:/app
      - /app/.venv # anonymous volume: keep the image's venv, not the host's
    command: ["uv", "run", "pytest", "-m", "unit or integration or contract or arch"]

  # docker compose --profile e2e run --rm e2e
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.47.0-jammy
    working_dir: /work
    volumes:
      - ./e2e:/work
    environment:
      API_BASE_URL: http://api:8000
      WEB_BASE_URL: http://web:5173
    command: ["sh", "-c", "echo 'e2e: Playwright journeys land in P7'"]

volumes:
  pgdata:
